.fg{animation:bob2 .31s ease-in-out infinite alternate}
.a1,.l1,.k1{animation-duration:.62s;animation-iteration-count:infinite}
.a1{animation-name:am;animation-timing-function:ease-in-out}
.l1{animation-name:th;animation-timing-function:ease-in-out}

const avStore={get(){try{const v=localStorage.getItem("bible_av");return v===null?null:+v}catch(e){return null}},set(v){try{localStorage.setItem("bible_av",v)}catch(e){}}};
function setStatus(txt,err){const s=$("status");s.textContent=txt||"";s.className="sv"+(err?" err":"");$("sbar").classList.toggle("hide",!txt&&$("retry").classList.contains("hide"))}
const showRetry=v=>{$("retry").classList.toggle("hide",!v);if(v)$("sbar").classList.remove("hide")};
async function pull(){
  if(!ready)return;
  try{
    const r=await fetch(SB_URL+"/rest/v1/progress?select=id,ch,last",{headers:H});
    if(!r.ok){let m="";try{m=(await r.text()).slice(0,160)}catch(x){}throw new Error("HTTP "+r.status+(m?" · "+m:""))}
    const rows=await r.json(),o={};
    rows.forEach(v=>{if(typeof v.ch==="string"&&v.ch.length===N){const a=parseAv(v.last);o[v.id]={ch:v.ch,lg:parseLog(v.last),notes:parseNotes(v.last),reacts:parseReacts(v.last),who:v.id,av:a===null?DEFAV[v.id]:a}}});
    if(who){
      if(!dirty&&o[who]){ch=o[who].ch;lg=o[who].lg;notes=o[who].notes||{};reacts=o[who].reacts||{};if(typeof o[who].av==="number")av=o[who].av}
      o[who]=mine();
    }
    others=o;loaded=true;setStatus("");showRetry(false);render();
  }catch(e){setStatus("불러오기 실패 — "+(e&&e.message?e.message:"네트워크 오류"),true);showRetry(true)}
}
function save(){
  if(!ready||!who)return;
  dirty=true;setStatus("저장 중…");clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const body=JSON.stringify({id:who,ch,last:dumpLog(lg,av,notes,reacts),updated:Date.now()});
    try{
      const r=await fetch(SB_URL+"/rest/v1/progress?on_conflict=id",{method:"POST",headers:Object.assign({},H,{Prefer:"resolution=merge-duplicates,return=minimal"}),body});
      if(!r.ok){let m="";try{m=(await r.text()).slice(0,160)}catch(x){}throw new Error("HTTP "+r.status+(m?" · "+m:""))}
      dirty=false;setStatus("저장 완료");setTimeout(()=>{if(!dirty)setStatus("")},2000);
    }catch(e){setStatus("저장 실패 — "+(e&&e.message?e.message:"네트워크 오류"),true)}
  },500);
}
async function pickWho(w,avi){
  who=w;store.set(w);ch="0".repeat(N);lg={};notes={};reacts={};dirty=false;loaded=false;
  av=typeof avi==="number"?avi:DEFAV[w];render();
  await pull();
  if(typeof avi==="number")av=avi;
  if(typeof avi==="number"||!others[w]){others[w]=mine();save()}
  render();
}

let celRaf=0;
function confetti(){
  const cv=$("celc"),ctx=cv.getContext("2d"),dpr=Math.min(2,window.devicePixelRatio||1);
  const W=cv.width=innerWidth*dpr,Hh=cv.height=innerHeight*dpr;
  const CLR=["#d9627a","#4a7fc1","#3f7d58","#e0b24a","#c0603f","#8a6fa8","#f0c419"];
  const ps=[];
  for(let i=0;i<140;i++)ps.push({x:W*(.2+Math.random()*.6),y:Hh*(.45+Math.random()*.1),
    vx:(Math.random()-.5)*11*dpr,vy:(-9-Math.random()*9)*dpr,w:(5+Math.random()*6)*dpr,h:(8+Math.random()*8)*dpr,
    r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:CLR[i%CLR.length]});
  const t0=Date.now();
  cancelAnimationFrame(celRaf);
  (function step(){
    ctx.clearRect(0,0,W,Hh);
    ps.forEach(p=>{p.vy+=.32*dpr;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(Date.now()-t0<4200&&!$("cel").classList.contains("hide"))celRaf=requestAnimationFrame(step);
    else ctx.clearRect(0,0,W,Hh);
  })();
}
function openCel(win){
  $("celface").innerHTML=faceSVG(av,TINT[who]||"#eee");
  $("celarm").innerHTML=win?trophySVG():armorSVG();
  $("celttl").innerHTML=win?"한 주 동안<br>말씀으로 사셨습니다":"오늘 묵상도 완료하셨네요!<br>당신은 승리하셨습니다.";
  $("celsub").textContent=win?"월요일부터 토요일까지 6일, 완주하셨어요. 🏆":"생명의 말씀으로 우리는 10+ 무장되었습니다.";
  $("cel").classList.remove("hide");document.body.style.overflow="hidden";
  try{confetti()}catch(e){}
}
function closeCel(){$("cel").classList.add("hide");document.body.style.overflow="";cancelAnimationFrame(celRaf)}
$("celok").onclick=closeCel;
$("cel").onclick=e=>{if(e.target.id==="cel")closeCel()};
function maybeCelebrate(){
  if(!who)return;
  const t=todayStr();
  if(!((lg[t]&&lg[t].length)||notes[t]))return;
  const wd=weekDays(),full=wd.every(d=>lg[d]&&lg[d].length);
  if(full){
    const wk="bible_win_"+who+"_"+wd[0];
    let shown=false;try{shown=!!localStorage.getItem(wk);if(!shown)localStorage.setItem(wk,"1")}catch(e){}
    try{localStorage.setItem("bible_cel_"+who+"_"+t,"1")}catch(e){}
    if(!shown){setTimeout(()=>openCel(true),220);return}
  }
  const k="bible_cel_"+who+"_"+t;
  try{if(localStorage.getItem(k))return;localStorage.setItem(k,"1")}catch(e){}
  setTimeout(()=>openCel(false),220);
}

// ---------- 첫 실행 안내 ----------
let iStep=0,iWho="",iAv=0;
function openIntro(step){
  iStep=step||0;iWho=who||"";iAv=who?av:0;
  $("intro").classList.remove("hide");document.body.style.overflow="hidden";renderIntro();
}
function closeIntro(){$("intro").classList.add("hide");document.body.style.overflow=""}
function renderIntro(){
  const body=$("ibody");body.innerHTML="";
  $("icancel").classList.toggle("hide",!who);
  $("iback").classList.toggle("hide",iStep===0);
  if(iStep===0){
    $("ititle").textContent="누구로 기록할까요?";
    $("idone").textContent="다음";$("idone").disabled=!iWho;
    const w=document.createElement("div");w.className="ipick";
    NAMES.forEach(n=>{
      const bt=document.createElement("button");
      bt.innerHTML=faceSVG(iWho===n?iAv:(others[n]&&typeof others[n].av==="number"?others[n].av:DEFAV[n]),TINT[n]);
      const sp=document.createElement("span");sp.textContent=n;bt.appendChild(sp);
      const on=iWho===n;
      bt.style.cssText="background:"+(on?COL[n]:"transparent")+";border-color:"+COL[n]+";color:"+(on?"#fff":COL[n]);
      bt.onclick=()=>{if(iWho!==n)iAv=others[n]&&typeof others[n].av==="number"?others[n].av:DEFAV[n];iWho=n;renderIntro()};
      w.appendChild(bt);
    });
    body.appendChild(w);
    const p=document.createElement("p");p.className="note";p.textContent="고른 이름은 이 기기에 기억돼요. 나중에 바꿀 수 있어요.";body.appendChild(p);
  }else{
    $("ititle").textContent=iWho+"님의 아바타를 골라주세요";
    $("idone").textContent="시작하기";$("idone").disabled=false;
    const g=document.createElement("div");g.className="avg";
    AV.forEach((a,i)=>{
      const b=document.createElement("button");b.className=i===iAv?"on":"";
      b.innerHTML=faceSVG(i,TINT[iWho]||"#eee");
      const sp=document.createElement("span");sp.textContent=a.l;b.appendChild(sp);
      b.onclick=()=>{iAv=i;renderIntro()};g.appendChild(b);
    });
    body.appendChild(g);
    const p=document.createElement("p");p.className="note";p.textContent="달리기 트랙에도 이 얼굴로 나와요.";body.appendChild(p);
  }
}
$("iback").onclick=()=>{iStep=0;renderIntro()};
$("icancel").onclick=closeIntro;
$("idone").onclick=async()=>{
  if(iStep===0){if(!iWho)return;iStep=1;renderIntro();return}
  const changed=iWho!==who;
  av=iAv;avStore.set(av);
  closeIntro();
  if(changed)await pickWho(iWho,iAv);
  else{others[who]=mine();render();save()}
};

// ---------- 이벤트 ----------
$("quick").onclick=()=>{if(!who){openIntro(0);return}openPick()};
$("openpick").onclick=()=>{if(!who){openIntro(0);return}openPick()};
$("mcancel").onclick=closePick;
$("mx").onclick=closePick;
$("mdone").onclick=applyPick;
$("mback").onclick=()=>{mbook=-1;rangeStart=-1;renderModal(true)};
let composing=false;
$("mq").addEventListener("compositionstart",()=>{composing=true});
$("mq").addEventListener("compositionend",()=>{composing=false;q=$("mq").value.trim();renderModal()});
$("mq").addEventListener("input",()=>{if(composing)return;q=$("mq").value.trim();renderModal()});
$("modal").onclick=e=>{if(e.target.id==="modal")closePick()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePick()});

$("chg").onclick=()=>openIntro(0);
$("chgav").onclick=()=>openIntro(1);
let curPg="home";
function go(p){
  curPg=p;
  ["home","bible","log","me"].forEach(k=>$("pg-"+k).classList.toggle("hide",k!==p));
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.pg===p));
  if(p==="log")focusToday();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>go(b.dataset.pg));
$("cprev").onclick=()=>{vm--;if(vm<0){vm=11;vy--}renderCal(todayStr())};
$("cnext").onclick=()=>{vm++;if(vm>11){vm=0;vy++}renderCal(todayStr())};
$("cadd").onclick=()=>openPick(selDate);
function focusToday(){const t=todayStr();selDate=t;vy=+t.slice(0,4);vm=+t.slice(5,7)-1;renderCal(t)}
$("ctoday").onclick=focusToday;
$("resetall").onclick=()=>{
  if(!who)return;
  const c=count(ch);
  if(!c&&!Object.keys(lg).length){toast("지울 기록이 없어요",false);return}
  if(!confirm("정말 "+(FULL[who]||who)+"님의 기록 "+c+"장을 모두 해제할까요? 날짜별 기록도 지워져요."))return;
  undoSnap=snap();ch="0".repeat(N);lg={};
  others[who]=mine();render();save();toast("기록을 모두 해제했어요",true);
};
$("editday").onclick=()=>{const b=$("dayedit");b.classList.toggle("hide");renderDayEdit();$("editday").textContent=b.classList.contains("hide")?"오늘 기록 수정":"닫기"};
$("noteinput").oninput=()=>{noteEditing=true;$("nlen").textContent=$("noteinput").value.length+" / 300"};
$("noteinput").onfocus=()=>{noteEditing=true;if(!who)openIntro(0)};
$("nsave").onclick=()=>{
  if(!who)return;
  const v=$("noteinput").value.trim(),d=selDate;
  if(v)notes[d]=v;else delete notes[d];
  noteEditing=false;others[who]=mine();renderCal(todayStr());save();toast(v?"묵상을 저장했어요":"묵상을 지웠어요",false);if(v)maybeCelebrate();
};
$("ndel").onclick=()=>{if(!who||!notes[selDate])return;$("noteinput").value="";delNote(selDate)};
$("retry").onclick=()=>{setStatus("불러오는 중…");pull()};
function tick(){
  const t=todayStr();
  if(t!==curDay){const was=selDate===curDay;curDay=t;if(was)focusToday();render()}
}

(async()=>{
  who=store.get();
  const sa=avStore.get();av=sa===null?(DEFAV[who]||0):sa;
  render();
  if(!who)openIntro(0);
  setInterval(tick,15000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){tick();pull()}});
  if(!ready){loaded=true;setStatus("Supabase 설정이 없어 이 화면에서만 기록돼요.",true);if(who)others[who]=mine();render();return}
  await pull();
  setInterval(pull,10000);
})();
</script>
