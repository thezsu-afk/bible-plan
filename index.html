<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현주와 지수의 성경읽기</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#2b2a27;--mut:#7a766d;--ac:#3f7d58;--acbg:#e3f1e8;--bd:#e4dfd5;--st:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--card:#262522;--tx:#ece9e2;--mut:#9b968b;--ac:#6fbf8b;--acbg:#27402f;--bd:#3a3834;--st:#e8685a}}
:root[data-theme="dark"]{--bg:#1c1b19;--card:#262522;--tx:#ece9e2;--mut:#9b968b;--ac:#6fbf8b;--acbg:#27402f;--bd:#3a3834;--st:#e8685a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:600}
.sub,.note{color:var(--mut);font-size:13px}
.sub{margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.bar{height:10px;background:var(--acbg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.big{font-size:26px;font-weight:700;color:var(--ac)}
button{font:inherit;cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:8px;padding:8px 14px}
button.ghost{background:transparent;color:var(--ac)}
.stamps{display:flex;flex-wrap:wrap;gap:14px}
.sw{display:flex;flex-direction:column;align-items:center;width:64px;font-size:12px;text-align:center}
.sw .nm{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.stamp{position:relative;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:19px;opacity:.35;filter:grayscale(.7)}
.stamp.on{opacity:1;filter:none;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--st)}
.stamp b{display:none;position:absolute;right:-12px;bottom:-8px;width:28px;height:28px;border-radius:50%;background:var(--card);border:2px solid var(--st);color:var(--st);font-size:11px;line-height:24px;text-align:center;transform:rotate(-14deg)}
.stamp.on b{display:block}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;background:transparent;color:var(--ac)}
.tabs button.on{background:var(--ac);color:#fff}
.hide{display:none}
details{border-bottom:1px solid var(--bd);padding:6px 0}
summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary .c{color:var(--mut);font-size:12px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin:8px 0}
.grid button{padding:6px 0;font-size:12px;background:var(--card);color:var(--mut);border:1px solid var(--bd)}
.grid button.done{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid button.part{background:var(--acbg);color:var(--tx);border-color:var(--ac)}
.grid button.sel{outline:2px solid var(--tx);outline-offset:1px}
.small{padding:3px 10px;font-size:12px}
.rd{font-size:17px;font-weight:600;margin:4px 0 10px}
.pick{display:flex;gap:10px}.pick button{flex:1;padding:14px;font-size:17px}
</style>
</head>
<body>
<main>
  <h1>📖 현주와 지수의 성경읽기</h1>
  <p class="sub">장별·날짜별로 함께 체크해요. 오늘 읽은 사람은 도장이 찍혀요.</p>

  <div class="card hide" id="who">
    <h2>누구로 기록할까요? (처음 한 번만 고르면 돼요)</h2>
    <div class="pick"><button data-w="지수" style="background:#d9627a;border-color:#d9627a">지수</button><button data-w="현주" style="background:#4a7fc1;border-color:#4a7fc1">현주</button></div>
  </div>

  <div class="card">
    <h2>오늘 읽은 사람들</h2>
    <div class="stamps" id="stamps"><span class="note">불러오는 중…</span></div>
  </div>

  <div class="card">
    <div class="row"><h2 style="margin:0">내 진행률</h2><span class="big" id="pct">0%</span></div>
    <div class="bar"><i id="mybar"></i></div>
    <p class="note" id="cnt" style="margin:8px 0 0"></p>
    <p class="note" style="margin:6px 0 0"><span id="mename"></span><button class="ghost small hide" id="chg">이름 변경</button></p>
  </div>

  <div class="tabs">
    <button id="t1" class="on">장별 체크</button>
    <button id="t2">날짜별 체크</button>
  </div>

  <div class="card" id="v1"></div>

  <div class="card hide" id="v2">
    <div class="grid" id="dgrid"></div>
    <h2 id="dtitle" style="margin-top:14px"></h2>
    <div class="rd" id="drd"></div>
    <button id="dtog"></button>
  </div>
  <p class="note" id="status"></p>
</main>
<script>
const BOOKS=[["창세기",50],["출애굽기",40],["레위기",27],["민수기",36],["신명기",34],["여호수아",24],["사사기",21],["룻기",4],["사무엘상",31],["사무엘하",24],["열왕기상",22],["열왕기하",25],["역대상",29],["역대하",36],["에스라",10],["느헤미야",13],["에스더",10],["욥기",42],["시편",150],["잠언",31],["전도서",12],["아가",8],["이사야",66],["예레미야",52],["예레미야애가",5],["에스겔",48],["다니엘",12],["호세아",14],["요엘",3],["아모스",9],["오바댜",1],["요나",4],["미가",7],["나훔",3],["하박국",3],["스바냐",3],["학개",2],["스가랴",14],["말라기",4],["마태복음",28],["마가복음",16],["누가복음",24],["요한복음",21],["사도행전",28],["로마서",16],["고린도전서",16],["고린도후서",13],["갈라디아서",6],["에베소서",6],["빌립보서",4],["골로새서",4],["데살로니가전서",5],["데살로니가후서",3],["디모데전서",6],["디모데후서",4],["디도서",3],["빌레몬서",1],["히브리서",13],["야고보서",5],["베드로전서",5],["베드로후서",3],["요한1서",5],["요한2서",1],["요한3서",1],["유다서",1],["요한계시록",22]];
const DAYS=365, CH=[], START=[];
BOOKS.forEach(([b,n])=>{START.push(CH.length);for(let i=1;i<=n;i++)CH.push([b,i])});
const N=CH.length;
const FACE_J='<svg viewBox="0 0 48 48" width="48" height="48" style="border-radius:50%;display:block"><rect width="48" height="48" fill="#f7c6d0"/><ellipse cx="24" cy="23" rx="14.5" ry="16" fill="#2a1f1d"/><path d="M8 48c1-7 8-9 16-9s15 2 16 9z" fill="#fff"/><ellipse cx="24" cy="26" rx="11" ry="13" fill="#ffe0c8"/><path d="M12 24C11 12 17 8 24 8s13 4 12 16c-2-4-6-6.500-12-6.500S14 20 12 24z" fill="#2a1f1d"/><circle cx="19.5" cy="27.500" r="1.400" fill="#2b2a27"/><circle cx="28.5" cy="27.500" r="1.400" fill="#2b2a27"/><circle cx="16.5" cy="31.500" r="2.200" fill="#ff9aa8" opacity=".5"/><circle cx="31.5" cy="31.500" r="2.200" fill="#ff9aa8" opacity=".5"/><path d="M21 34q3 2.600 6 0" stroke="#c0555f" stroke-width="1.300" fill="none" stroke-linecap="round"/></svg>';
const FACE_H='<svg viewBox="0 0 48 48" width="48" height="48" style="border-radius:50%;display:block"><rect width="48" height="48" fill="#cfe0f5"/><path d="M9 30C6 12 14 5 24 5s18 7 15 25c-1 6-3 10-4 12H13c-1-2-3-6-4-12z" fill="#3b2a26"/><path d="M8 48c1-7 8-9 16-9s15 2 16 9z" fill="#fff"/><ellipse cx="24" cy="26" rx="11" ry="13" fill="#ffe0c8"/><path d="M13 24c1-9 6-13 12-13s9 4 10 13c-4-3-9-6-13-8-3 4-5 6-9 8z" fill="#3b2a26"/><circle cx="19.5" cy="27" r="1.4" fill="#2b2a27"/><circle cx="28.5" cy="27" r="1.4" fill="#2b2a27"/><circle cx="16.5" cy="31" r="2.2" fill="#ff9aa8" opacity=".5"/><circle cx="31.5" cy="31" r="2.2" fill="#ff9aa8" opacity=".5"/><path d="M21 33.5q3 2.6 6 0" stroke="#c0555f" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>';
const $=id=>document.getElementById(id);
const dayRange=d=>[Math.floor((d-1)*N/DAYS),Math.floor(d*N/DAYS)-1];
function reading(d){
  const [s,e]=dayRange(d),p=[];let i=s;
  while(i<=e){const b=CH[i][0],a=CH[i][1];let j=i;while(j+1<=e&&CH[j+1][0]===b)j++;const z=CH[j][1];p.push(b+" "+(a===z?a+"장":a+"–"+z+"장"));i=j+1}
  return p.join(", ");
}
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const count=(s,a=0,b=s.length-1)=>{let c=0;for(let i=a;i<=b;i++)if(s[i]==="1")c++;return c};

let ch="0".repeat(N), last="", who="", sel=1, myId=null, db=null, user=null, others={}, names={}, saveTimer=null, built=false;
const chBtns=[], bookEls=[], dayBtns=[];

function buildBooks(){
  const box=$("v1");
  BOOKS.forEach(([b,n],bi)=>{
    const det=document.createElement("details");
    const sm=document.createElement("summary");
    const t=document.createElement("span");t.textContent=b;
    const c=document.createElement("span");c.className="c";
    sm.append(t,c);det.appendChild(sm);
    const g=document.createElement("div");g.className="grid";
    for(let i=0;i<n;i++){
      const k=START[bi]+i, btn=document.createElement("button");
      btn.textContent=i+1;btn.onclick=()=>setChapters(k,k,ch[k]!=="1");
      g.appendChild(btn);chBtns[k]=btn;
    }
    det.appendChild(g);
    const all=document.createElement("button");all.className="ghost small";
    all.onclick=()=>{const a=START[bi],z=a+n-1;setChapters(a,z,count(ch,a,z)<n)};
    det.appendChild(all);
    box.appendChild(det);bookEls.push({c,all,a:START[bi],z:START[bi]+n-1,n});
  });
  const dg=$("dgrid");
  for(let d=1;d<=DAYS;d++){const b=document.createElement("button");b.textContent=d;b.onclick=()=>{sel=d;render()};dg.appendChild(b);dayBtns[d]=b}
}

function setChapters(a,z,on){
  if(!who){$("who").scrollIntoView({behavior:"smooth"});return}
  ch=ch.substring(0,a)+(on?"1":"0").repeat(z-a+1)+ch.substring(z+1);
  if(on)last=todayStr();
  others[myId||"me"]={ch,last,who};
  render();save();
}

function render(){
  if(!built){buildBooks();built=true}
  const c=count(ch);
  $("pct").textContent=Math.round(c/N*100)+"%";
  $("mybar").style.width=(c/N*100)+"%";
  $("cnt").textContent=c+" / "+N+"장 읽음";
  $("who").classList.toggle("hide",!!who);$("chg").classList.toggle("hide",!who);$("mename").textContent=who?who+"(으)로 기록 중 ":"";
  for(let k=0;k<N;k++)chBtns[k].className=ch[k]==="1"?"done":"";
  bookEls.forEach(o=>{const d=count(ch,o.a,o.z);o.c.textContent=d+" / "+o.n;o.all.textContent=d===o.n?"이 책 전체 해제":"이 책 전체 읽음"});
  for(let d=1;d<=DAYS;d++){const [s,e]=dayRange(d),x=count(ch,s,e),t=e-s+1;dayBtns[d].className=(x===t&&t>0?"done":x>0?"part":"")+(d===sel?" sel":"")}
  const [s,e]=dayRange(sel),full=count(ch,s,e)===e-s+1;
  $("dtitle").textContent=sel+"일차";$("drd").textContent=reading(sel);
  $("dtog").textContent=full?"이 날 읽음 취소":"이 날 분량 모두 읽음 ✓";
  $("dtog").className=full?"ghost":"";
  renderStamps();
}

async function renderStamps(){
  const ids=Object.keys(others),box=$("stamps");
  if(user&&ids.length){try{names=await user.profiles(ids)}catch(e){}}
  const t=todayStr();
  const rows=ids.map(id=>{const p=names[id]||{},w=others[id].who;return{id,name:w||p.name||"멤버",color:({"지수":"#d9627a","현주":"#4a7fc1"})[w]||p.color||"#3f7d58",on:others[id].last===t,me:id===myId||id==="me"}})
    .sort((a,b)=>(b.on-a.on)||(b.me-a.me));
  if(!rows.length){box.innerHTML='<span class="note">아직 기록한 사람이 없어요.</span>';return}
  box.innerHTML="";
  rows.forEach(r=>{
    const w=document.createElement("div");w.className="sw";
    const s=document.createElement("div");s.className="stamp"+(r.on?" on":"");s.style.background=r.color;
    if(r.name==="지수")s.innerHTML=FACE_J;else if(r.name==="현주")s.innerHTML=FACE_H;else s.textContent=(r.name||"?").trim().charAt(0)||"?";
    const k=document.createElement("b");k.textContent="읽음";s.appendChild(k);
    const n=document.createElement("div");n.className="nm";n.textContent=r.name+(r.me?" (나)":"");
    w.append(s,n);box.appendChild(w);
  });
}


$("dtog").onclick=()=>{const [s,e]=dayRange(sel);setChapters(s,e,count(ch,s,e)<e-s+1)};
function tab(n){$("v1").classList.toggle("hide",n!==1);$("v2").classList.toggle("hide",n!==2);$("t1").className=n===1?"on":"";$("t2").className=n===2?"on":""}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
document.querySelectorAll("#who [data-w]").forEach(b=>b.onclick=()=>pickWho(b.dataset.w));
$("chg").onclick=()=>{who="";render()};

// ===== 설정: Supabase 프로젝트 값을 아래에 붙여넣으세요 =====
const SB_URL="https://svjxbsqudprknmovpyep.supabase.co";
const SB_KEY="sb_publishable_2dIFV4GVKVsKv2NZVgW3nw_TqXpCtMR";
// =========================================================
const ready=!SB_URL.includes("YOUR-")&&!SB_KEY.includes("YOUR-");
const H={apikey:SB_KEY,"Content-Type":"application/json"};if(!SB_KEY.startsWith("sb_"))H.Authorization="Bearer "+SB_KEY;
let pending=false;
const store={get(){try{return localStorage.getItem("bible_who")||""}catch(e){return ""}},set(v){try{localStorage.setItem("bible_who",v)}catch(e){}}};

async function pull(adopt){
  if(!ready)return;
  try{
    const r=await fetch(SB_URL+"/rest/v1/progress?select=id,ch,last",{headers:H});
    if(!r.ok)throw 0;
    const rows=await r.json(),o={};
    rows.forEach(v=>{if(v.ch&&v.ch.length===N)o[v.id]={ch:v.ch,last:v.last||"",who:v.id}});
    if(who&&adopt&&o[who]){ch=o[who].ch;last=o[who].last;sel=1;for(let k=0;k<N&&ch[k]==="1";k++)sel=Math.min(DAYS,Math.floor(k*DAYS/N)+1)}
    if(who&&(!adopt||!o[who]))o[who]={ch,last,who};
    others=o;$("status").textContent="";render();
  }catch(e){$("status").textContent="공유 데이터를 불러오지 못했어요. 인터넷 연결을 확인해주세요."}
}

function save(){
  if(!ready||!who)return;
  pending=true;clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      const r=await fetch(SB_URL+"/rest/v1/progress?on_conflict=id",{method:"POST",headers:{...H,Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:who,ch,last,updated:Date.now()})});
      if(!r.ok)throw 0;
      pending=false;$("status").textContent="";
    }catch(e){$("status").textContent="저장하지 못했어요. 잠시 후 다시 시도해주세요."}
  },400);
}

async function pickWho(w){
  who=w;myId=w;store.set(w);
  await pull(true);
  others[w]=others[w]||{ch,last,who};
  render();save();
}

(async()=>{
  who=store.get();myId=who||null;
  render();
  if(!ready){$("status").textContent="아직 설정되지 않았어요. 코드 위쪽의 SB_URL, SB_KEY에 Supabase 값을 넣어주세요. 지금은 이 화면에서만 기록돼요.";others=who?{[who]:{ch,last,who}}:{};renderStamps();return}
  await pull(true);
  setInterval(()=>pull(!pending),10000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull(!pending)});
})();
</script>
</body>
</html>
